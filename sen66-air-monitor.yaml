esphome:
  name: sen66-air-monitor
  friendly_name: SEN66 Air Monitor
  # Chueli's status logic and thresholds.
  includes:
    - airink.h

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# Use the ESP32-C3 native USB port for logs. This leaves GPIO20/D7 free
# for the display BUSY signal.
logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "SEN66 Fallback"
    password: test1234

captive_portal:

time:
  - platform: sntp
    id: network_time
    timezone: Europe/Zurich

# SEN66 I2C bus
i2c:
  id: sen66_bus
  sda: GPIO6       # D4
  scl: GPIO7       # D5
  frequency: 100kHz
  scan: true

# E-paper SPI bus
spi:
  clk_pin: GPIO8   # D8 / display CLK or SCL
  mosi_pin: GPIO10 # D10 / display DIN or SDA

sensor:
  - platform: sen6x
    type: SEN66
    i2c_id: sen66_bus
    address: 0x6B
    update_interval: 30s

    temperature:
      name: "Temperature"
      id: sen66_temperature

    humidity:
      name: "Humidity"
      id: sen66_humidity

    co2:
      name: "CO2"
      id: sen66_co2

    pm_1_0:
      name: "PM1.0"
      id: sen66_pm_1

    pm_2_5:
      name: "PM2.5"
      id: sen66_pm_2_5

    pm_4_0:
      name: "PM4.0"
      id: sen66_pm_4

    pm_10_0:
      name: "PM10"
      id: sen66_pm_10

    voc_index:
      name: "VOC Index"
      id: sen66_voc
      # Keep a few minutes of history for the "Hesch gfurzt?" detector.
      on_value:
        - lambda: airink::record_voc(x);

    nox_index:
      name: "NOx Index"
      id: sen66_nox

# Keeps the e-paper RST line (D2) high so the panel never resets between
# updates. See the note on the display below.
switch:
  - platform: gpio
    id: epaper_reset
    pin: GPIO4          # D2
    restore_mode: ALWAYS_ON
    internal: true

# Atkinson Hyperlegible Next keeps digits and letters distinct at a glance.
font:
  - file: &atkinson_bold
      type: gfonts
      family: Atkinson Hyperlegible Next
      weight: 700
    id: font_co2
    size: 44
    glyphs: "0123456789-"

  - file: *atkinson_bold
    id: font_big
    size: 40
    glyphs: "0123456789-"

  # Status line plus the small decimal and unit next to the big numbers.
  - file: *atkinson_bold
    id: font_status
    size: 20
    glyphs: &text_glyphs " !'-.:0123456789?%°…ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜ"

  - file: *atkinson_bold
    id: font_time
    size: 14
    glyphs: "0123456789:-"

  - file: &atkinson_regular
      type: gfonts
      family: Atkinson Hyperlegible Next
      weight: 400
    id: font_small
    size: 14
    glyphs: *text_glyphs

  # The font has no subscript ₂, so CO₂ gets a small "2" instead.
  - file: *atkinson_regular
    id: font_subscript
    size: 10
    glyphs: "2"

# Chueli the cow, one face per status. Regenerate with tools/make_chueli.py.
image:
  - { platform: file, file: images/chueli/boot.png, id: chueli_boot, type: BINARY }
  - { platform: file, file: images/chueli/happy.png, id: chueli_happy, type: BINARY }
  - { platform: file, file: images/chueli/sleepy.png, id: chueli_sleepy, type: BINARY }
  - { platform: file, file: images/chueli/dizzy.png, id: chueli_dizzy, type: BINARY }
  - { platform: file, file: images/chueli/stink.png, id: chueli_stink, type: BINARY }
  - { platform: file, file: images/chueli/smoke.png, id: chueli_smoke, type: BINARY }
  - { platform: file, file: images/chueli/raclette.png, id: chueli_raclette, type: BINARY }
  - { platform: file, file: images/chueli/cough.png, id: chueli_cough, type: BINARY }
  - { platform: file, file: images/chueli/hot.png, id: chueli_hot, type: BINARY }
  - { platform: file, file: images/chueli/cold.png, id: chueli_cold, type: BINARY }
  - { platform: file, file: images/chueli/humid.png, id: chueli_humid, type: BINARY }
  - { platform: file, file: images/chueli/dry.png, id: chueli_dry, type: BINARY }

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 1.54inv2

    cs_pin: GPIO2       # D0
    dc_pin: GPIO3       # D1
    busy_pin: GPIO20    # D7
    # No reset_pin on purpose: with it, the driver resets the panel before
    # every update, which wipes the previous frame that partial refreshes
    # need, so old text stays visible under the new one. RST (D2) is held
    # high by the epaper_reset switch below instead.

    # Rotate the complete interface for horizontal mounting. Because the
    # display is square, this changes its reading direction, not its size.
    rotation: 90
    update_interval: 60s
    full_update_every: 10

    lambda: |-
      // Black on white: Chueli top left, big numbers, one status line and a
      // small footer. Sized to be read from 30–40 cm.
      const Color ink = COLOR_ON;       // black on e-paper
      const Color paper = COLOR_OFF;    // white on e-paper
      it.fill(paper);

      auto width = [&](font::Font *font, const char *text) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, text, font, TextAlign::BASELINE_LEFT,
                           &x1, &y1, &w, &h);
        return w;
      };

      float co2 = id(sen66_co2).state;
      float pm25 = id(sen66_pm_2_5).state;
      float voc = id(sen66_voc).state;
      float nox = id(sen66_nox).state;
      float temp = id(sen66_temperature).state;
      float humidity = id(sen66_humidity).state;

      auto now = id(network_time).now();
      auto status = airink::pick_status(co2, pm25, voc, nox, temp, humidity,
                                        now.is_valid(), now.month, now.hour,
                                        now.minute);

      // Chueli. White pixels in the PNG are "on", so paper is passed first.
      image::Image *face = id(chueli_boot);
      switch (status.mood) {
        case airink::Mood::Happy: face = id(chueli_happy); break;
        case airink::Mood::Sleepy: face = id(chueli_sleepy); break;
        case airink::Mood::Dizzy: face = id(chueli_dizzy); break;
        case airink::Mood::Stink: face = id(chueli_stink); break;
        case airink::Mood::Smoke: face = id(chueli_smoke); break;
        case airink::Mood::Raclette: face = id(chueli_raclette); break;
        case airink::Mood::Cough: face = id(chueli_cough); break;
        case airink::Mood::Hot: face = id(chueli_hot); break;
        case airink::Mood::Cold: face = id(chueli_cold); break;
        case airink::Mood::Humid: face = id(chueli_humid); break;
        case airink::Mood::Dry: face = id(chueli_dry); break;
        case airink::Mood::Boot: break;
      }
      it.image(3, 3, face, paper, ink);

      // CO₂, the number that says when to open a window.
      it.print(190, 22, id(font_small), ink, TextAlign::BASELINE_RIGHT, "ppm");
      int label_x = 190 - width(id(font_small), "ppm") - 4;
      it.print(label_x, 25, id(font_subscript), ink, TextAlign::BASELINE_RIGHT, "2");
      label_x -= width(id(font_subscript), "2");
      it.print(label_x, 22, id(font_small), ink, TextAlign::BASELINE_RIGHT, "CO");
      if (isnan(co2)) {
        it.print(190, 66, id(font_co2), ink, TextAlign::BASELINE_RIGHT, "--");
      } else {
        it.printf(190, 66, id(font_co2), ink, TextAlign::BASELINE_RIGHT, "%.0f", co2);
      }

      it.filled_rectangle(10, 78, 180, 2, ink);

      // Temperature with a small decimal, e.g. 21 + ".6°".
      char whole[12] = "--";
      char decimal[12] = "°";
      if (!isnan(temp)) {
        char reading[12];
        snprintf(reading, sizeof(reading), "%.1f", temp);
        char *point = strchr(reading, '.');
        snprintf(decimal, sizeof(decimal), "%s°", point);
        *point = '\0';
        snprintf(whole, sizeof(whole), "%s", reading);
      }
      it.print(10, 122, id(font_big), ink, TextAlign::BASELINE_LEFT, whole);
      it.print(10 + width(id(font_big), whole), 122, id(font_status), ink,
               TextAlign::BASELINE_LEFT, decimal);

      it.filled_rectangle(104, 88, 1, 38, ink);

      // Humidity with a small percent sign.
      it.print(190, 122, id(font_status), ink, TextAlign::BASELINE_RIGHT, "%");
      int humidity_x = 190 - width(id(font_status), "%");
      if (isnan(humidity)) {
        it.print(humidity_x, 122, id(font_big), ink, TextAlign::BASELINE_RIGHT, "--");
      } else {
        it.printf(humidity_x, 122, id(font_big), ink, TextAlign::BASELINE_RIGHT,
                  "%.0f", humidity);
      }

      it.filled_rectangle(10, 132, 180, 2, ink);

      // Chueli's status line. Every status looks the same; only the words
      // and the face change.
      it.print(10, 161, id(font_status), ink, TextAlign::BASELINE_LEFT, status.text);

      // Footer: PM2.5, VOC (or NOx when it is the reason) and the time.
      if (isnan(pm25)) {
        it.print(10, 190, id(font_small), ink, TextAlign::BASELINE_LEFT, "PM --");
      } else {
        it.printf(10, 190, id(font_small), ink, TextAlign::BASELINE_LEFT, "PM %.0f", pm25);
      }

      const char *gas_label = status.show_nox ? "NOx" : "VOC";
      float gas = status.show_nox ? nox : voc;
      if (isnan(gas)) {
        it.printf(78, 190, id(font_small), ink, TextAlign::BASELINE_LEFT, "%s --", gas_label);
      } else {
        it.printf(78, 190, id(font_small), ink, TextAlign::BASELINE_LEFT, "%s %.0f",
                  gas_label, gas);
      }

      if (now.is_valid()) {
        it.strftime(190, 190, id(font_time), ink, TextAlign::BASELINE_RIGHT, "%H:%M", now);
      } else {
        it.print(190, 190, id(font_time), ink, TextAlign::BASELINE_RIGHT, "--:--");
      }
